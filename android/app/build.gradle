plugins {
    id "com.android.application"
}

def releaseVersion = new Properties()
rootProject.file("version.properties").withInputStream { releaseVersion.load(it) }

android {
    namespace "xyz.aookshizuo.reedenlibrary"
    compileSdk 35

    defaultConfig {
        applicationId "xyz.aookshizuo.reedenlibrary"
        minSdk 23
        targetSdk 35
        versionCode releaseVersion.VERSION_CODE.toInteger()
        versionName releaseVersion.VERSION_NAME
    }

    // Bundle the same static site into the APK. The WebView still opens it
    // under the GitHub Pages origin, so the R2 Worker sees the same allowed
    // Origin as the desktop/mobile browser.
    sourceSets {
        main {
            assets.srcDirs = ["../../dist"]
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}
